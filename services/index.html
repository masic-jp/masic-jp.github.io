  <style>
    :root {
      --c-bg: #ffffff;
      --c-text: #0f172a;
      --c-text-muted: #64748b;
      --c-primary: #0ea5e9;
      --c-primary-dark: #0284c7;
      --c-surface: #f8fafc;
      --c-border: #e2e8f0;
      --font-en: 'Inter', sans-serif;
      --font-ja: 'Noto Sans JP', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-en);
      color: var(--c-text);
      background-color: var(--c-bg);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h1, h2, h3 { font-family: var(--font-ja); line-height: 1.3; font-weight: 700; }
    p { font-family: var(--font-ja); }

    .nav {
      position: sticky;
      top: 0;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      z-index: 1000;
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--c-text);
    }
    .nav-logo { height: 40px; width: auto; }
    .nav-title { font-weight: 800; font-size: 1.25rem; letter-spacing: 0.05em; }
    .nav-links { display: flex; align-items: center; gap: 1.25rem; }
    .nav-link {
      font-family: var(--font-ja);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--c-text);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-link:hover,
    .nav-link.is-current { color: var(--c-primary); }
    .nav-contact {
      font-family: var(--font-ja);
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
      background: var(--c-text);
      padding: 0.6rem 1.25rem;
      border-radius: 999px;
      text-decoration: none;
      transition: background 0.3s;
    }
    .nav-contact:hover { background: var(--c-primary); }

    main {
      flex: 1;
      padding: 6rem 5% 4rem;
      position: relative;
      overflow: hidden;
    }
    .bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 80% 20%, rgba(14, 165, 233, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 20% 80%, rgba(2, 132, 199, 0.04) 0%, transparent 40%);
      z-index: -1;
    }
    .page { max-width: 800px; margin: 0 auto; width: 100%; }
    .page-label {
      font-family: var(--font-en);
      font-weight: 800;
      color: var(--c-primary);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: block;
    }
    .page-title {
      font-size: clamp(1.5rem, 3.5vw, 2rem);
      font-weight: 700;
      margin-bottom: 2.5rem;
    }
    .coming-soon {
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: 24px;
      padding: 2.5rem 2rem;
    }
    .coming-soon p {
      color: var(--c-text-muted);
      font-size: 1.05rem;
    }
    .coming-soon p + p { margin-top: 1rem; }
    .coming-soon a { color: var(--c-primary); text-decoration: none; }
    .coming-soon a:hover { text-decoration: underline; }

    .footer {
      background: #0f172a;
      color: #94a3b8;
      padding: 3rem 5%;
      text-align: center;
      font-size: 0.9rem;
    }
    .footer-logo {
      height: 36px;
      margin-bottom: 1.25rem;
      opacity: 0.5;
      filter: grayscale(100%) brightness(200%);
    }
    .footer-links { margin-bottom: 1rem; }
    .footer-links a {
      color: #64748b;
      text-decoration: none;
      font-size: 0.85rem;
      font-family: var(--font-ja);
    }
    .footer-links a:hover { color: #cbd5e1; text-decoration: underline; }

    @media (max-width: 640px) {
      .nav { padding: 0 4%; }
      .nav-logo { height: 32px; }
      .nav-title { display: none; }
      .nav-links { gap: 0.65rem; }
      .nav-link { font-size: 0.8rem; }
      .nav-contact {
        padding: 0;
        background: transparent;
        color: var(--c-text);
        border-radius: 0;
        font-size: 0.8rem;
      }
      .nav-contact:hover { background: transparent; color: var(--c-primary); }
    }
  </style>
</head>
<body>
